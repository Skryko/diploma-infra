name: Terraform

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure_yc/**'
      - '.github/workflows/terraform.yml'
  pull_request:
    paths:
      - 'infrastructure_yc/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  TF_VERSION: "1.14.4"
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"
  WORKDIR: infrastructure_yc

jobs:
  terraform:
    name: Plan & Apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.WORKDIR }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Materialize secrets (SA key + tfvars)
        env:
          YC_SA_KEY_JSON: ${{ secrets.YC_SA_KEY_JSON }}
          S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
          S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
          ADMIN_CIDRS: ${{ secrets.ADMIN_CIDRS }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SSH_PUBLIC_KEY: ${{ secrets.SSH_PUBLIC_KEY }}
        run: |
          mkdir -p /tmp/secrets
          printf '%s' "$YC_SA_KEY_JSON" > /tmp/secrets/sa-key.json
          chmod 600 /tmp/secrets/sa-key.json

          printf '%s\n' "$SSH_PUBLIC_KEY" > /tmp/secrets/id_ed25519.pub
          chmod 600 /tmp/secrets/id_ed25519.pub

          cat > terraform.tfvars <<EOF
          cloud_id            = "${YC_CLOUD_ID}"
          folder_id           = "${YC_FOLDER_ID}"
          admin_cidrs         = ${ADMIN_CIDRS}
          ssh_public_key_path = "/tmp/secrets/id_ed25519.pub"
          EOF

          {
            echo "AWS_ACCESS_KEY_ID=$S3_ACCESS_KEY"
            echo "AWS_SECRET_ACCESS_KEY=$S3_SECRET_KEY"
            echo "YC_SERVICE_ACCOUNT_KEY_FILE=/tmp/secrets/sa-key.json"
          } >> "$GITHUB_ENV"

      - name: Terraform fmt check
        run: terraform fmt -check -recursive || true

      - name: Terraform init
        run: terraform init -no-color

      - name: Terraform validate
        run: terraform validate -no-color

      - name: Terraform plan
        id: plan
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt
          wc -l plan.txt

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('${{ env.WORKDIR }}/plan.txt', 'utf8');
            const truncated = plan.length > 60000
              ? plan.slice(0, 60000) + '\n... (truncated)'
              : plan;
            const body = `### Terraform Plan\n\`\`\`\n${truncated}\n\`\`\``;
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Terraform apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: terraform apply -no-color -auto-approve tfplan

      - name: Cleanup secrets
        if: always()
        run: |
          rm -rf /tmp/secrets
          rm -f terraform.tfvars tfplan plan.txt || true
